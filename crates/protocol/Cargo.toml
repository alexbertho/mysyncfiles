[package]
name = "mysync-protocol"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Shared MySync wire contracts and cryptographic verification"

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "3"
getrandom = "0.4"
hex = "0.4"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
