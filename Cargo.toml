[package]
name = "mysyncfiles"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Linux file synchronization with a server-authoritative conflict policy"

[[bin]]
name = "mysync"
path = "src/bin/mysync.rs"

[[bin]]
name = "mysync-server"
path = "src/bin/mysync-server.rs"

[[bin]]
name = "mysync-release"
path = "src/bin/mysync-release.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "3"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.4"
hex = "0.4"
notify = "8"
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tss-esapi = "7.7"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
x509-parser = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
